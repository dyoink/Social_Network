version: '3.8'

services:
  # PostgreSQL - Database duy nhất của dự án
  postgres-db:
    image: postgres:15-alpine
    container_name: social_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: SocialNetworkDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d SocialNetworkDb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: